[versions]
jackson = "2.17.2"
picocli = "4.7.6"
junit = "5.10.3"
slf4j = "2.0.13"
ensNbt = "0.1.1"
ensNbtMca = "0.2.0"
spotless = "6.25.0"

[libraries]
jacksonDatabind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jacksonDataformatToml = { module = "com.fasterxml.jackson.dataformat:jackson-dataformat-toml", version.ref = "jackson" }
picocli = { module = "info.picocli:picocli", version.ref = "picocli" }
picocliCodegen = { module = "info.picocli:picocli-codegen", version.ref = "picocli" }
junitBom = { module = "org.junit:junit-bom", version.ref = "junit" }
junitJupiter = { module = "org.junit.jupiter:junit-jupiter" }
slf4jApi = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
slf4jSimple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }
ensNbt = { module = "io.github.ens-gijs.nbt:nbt", version.ref = "ensNbt" }
ensNbtMca = { module = "io.github.ens-gijs.nbt:nbt-mca", version.ref = "ensNbtMca" }

[plugins]
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
